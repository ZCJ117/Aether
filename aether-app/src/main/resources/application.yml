spring:
  config:
    name: aether-app
  profiles:
#   NOTE 2.在项目启动时优先加载application.yml, 在第六行激活 dev 因此它会加载 application-dev.yml 作为补充配置
    active: dev

# ====== P0: Security Configuration ======
aether:
  # SSRF 防护：生产环境必须为 false；开发环境在 application-dev.yml 中覆盖为 true
  ssrf:
    allow-private-urls: false
  security:
    jwt:
      secret: ${JWT_SECRET:aether-dev-jwt-secret-key-min-32-chars!!}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000
  # ====== 记忆系统（对齐 hermes cli-config.yaml memory 段）======
  memory:
    enabled: true                # 记忆系统总开关（hermes memory.memory_enabled）
    user-profile-enabled: true   # 用户画像记忆开关（hermes memory.user_profile_enabled）
    memory-char-limit: 2200      # 注入记忆上下文预算，≈800 token（hermes memory_char_limit）
    user-char-limit: 1375        # 用户画像上下文预算，≈500 token（hermes user_char_limit）
    nudge-interval: 10           # nudge 轮次间隔，0=禁用（hermes memory.nudge_interval）
    flush-min-turns: 6           # flush 最小轮次，0=禁用（hermes memory.flush_min_turns）
    recall:
      max-results: 10            # prefetch 检索 Top-K（hermes supermemory max_recall_results）
      semantic-weight: 0.6       # 语义相似度权重
      recency-weight: 0.3        # 时间衰减权重
      importance-weight: 0.1     # 重要性权重
      consolidation-threshold: 0.85  # 相似度合并阈值
      vector-dimension: 1024     # 向量维度（pgvector，与 embedding 模型一致）
    embedding:                   # 记忆向量生成（未配置 base-url 则语义检索降级）
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      path: v1/embeddings
      model: bge-m3
      dimension: 1024
    backfill:                    # 存量 NULL 向量回填
      enabled: true
      batch-size: 50
      max-per-run: 500
  # ====== D4: 可视化调试 ======
  delegation:
    live-log-dir: ./cache/delegation/live   # 每子Agent直播日志根目录（对齐 hermes cache/delegation/live）
    stale-timeout: PT10M                     # 挂起子Agent判定窗口（StaleDelegationScanner）
    stale-scan-interval-ms: 60000            # stale 扫描间隔；<=0 禁用
  subagent:
    terminal-retention: 100                  # runtimes 终态保留上限（超出逐出最旧）
  graph:
    trace:
      retention: 200                         # 图级 trace 内存保留执行数
      persistence: false                     # 是否异步落 JSONL（对齐 moa_trace.py opt-in）
      dir: ./cache/graph-traces
    background-review:                       # 后台自评审（与 trace 平级，@ConditionalOnProperty 读 aether.graph.background-review.*）
      enabled: false                         # 后台自评审总开关（默认关）
      model-ref: gpt-4o
