server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  config:
    import:
       - classpath:agent/agents.yml
#         classpath:agent/fable.yml
      # NOTE 3.在加载application-dev.yml之后，上面又导入agents.yml配置文件
  datasource:
    username: postgres
    password: ${DB_PASSWORD:123456}
    url: jdbc:postgresql://127.0.0.1:5432/aether
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: Aether_HikariCP
      minimum-idle: 15
      idle-timeout: 180000
      maximum-pool-size: 25
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource
  sql:
    init:
      mode: always

# ====== P0-4: 会话持久化（PostgreSQL） ======
aether:
  # ====== O5: 真流式开关（显式声明，便于灰度对比：true=chunk 级下发，false=旧缓冲路径）======
  model:
    invoker:
      true-streaming: true
  session:
    persistence: true
  # ====== D1: 异步委派持久化（PostgreSQL，激活 PgAsyncDelegationStore）======
  delegation:
    persistence: true
    live-log-dir: ./cache/delegation/live
    stale-timeout: PT10M
    stale-scan-interval-ms: 60000
  graph:
    # ====== D4: 图级 trace 落盘（开发环境开启便于离线审计）======
    trace:
      persistence: true
  memory:
    pgvector:
      enabled: true
    embedding:
      # 2026-09-28: 移除明文兜底。该 Key 曾随本文件入仓并泄露，本轮已轮换；未设置环境变量时为空串（RAG 全局默认关闭，不影响启动）
      api-key: ${ZHIPU_API_KEY:}
  # 开发环境允许访问本地 Python 微服务 (localhost:8001-8003)
  ssrf:
    allow-private-urls: true
  # ====== P0: JWT Security Configuration ======
  security:
    jwt:
      secret: ${JWT_SECRET:aether-dev-jwt-secret-key-min-32-chars!!}
  # ====== D4/F3-3: dev 显式启用 RAG 三级管道 ======
  # dev 具备 ChatModel + pgvector（memory.pgvector.enabled: true），故启用总开关与一级改写；
  # rerank 保持 false——它依赖 Python document-service（localhost:8001），由启动自检如实报告，
  # 而不是伪装成"三级全开"。全局默认值仍在 application.yml 保持 false（本次不翻转任何默认值）。
  rag:
    enabled: true
    rewrite:
      enabled: true
  # O16: CORS 白名单——未配置时拒绝所有跨域；Vite 代理转发会保留浏览器 Origin，dev 前端(5173)必须入列
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

# MyBatis 配置【如需使用记得打开】
#mybatis:
#  mapper-locations: classpath:/mybatis/mapper/*.xml
#  config-location:  classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# ====== P1-3: 可观测性配置 ======
# 【工程化闭环】可观测性端点按需暴露 health/info/metrics/prometheus：
# prometheus 端点供 Prometheus 定时拉取，metrics.tags.application=aether-agent 为所有指标
# 统一打上应用标签，便于多实例聚合与分面查询，是监控大盘与告警规则的数据来源闭环。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      # 【工程化闭环】全局指标标签：所有 Micrometer 指标自动携带 application=aether-agent，
      # 多实例部署时可在 Prometheus 中按应用维度聚合（如 sum by(application)），
      # 与自定义指标 aether.session.persist.failures 共用同一标签体系，统一可观测。
      application: aether-agent

# OpenTelemetry — 由 OTel Java Agent（-javaagent）在 JVM 启动时读取，非 Spring Boot 托管属性。
# IDE 警告 "无法解析配置属性 otel.*" 为预期行为，不影响运行时。
# 【工程化闭环】链路追踪经 OTLP 导出至 OTel Collector，service.name=aether-agent
# 与 metrics.tags.application 保持一致的应用标识；分布式调用链与指标/日志三支柱联动，
# 使跨服务 SSE 编排的延迟与异常可在追踪系统端到端还原，补全"可观测三支柱"闭环。
# 端点须支持环境变量覆盖：docker-compose 以 dev profile 启动并注入
# OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317，若此处写死 localhost，容器内将把 span
# 打向自身 loopback，导出链路静默失效（与 prod profile 的写法保持一致的解析顺序）。
otel:
  traces:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  service:
    name: aether-agent