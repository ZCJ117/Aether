server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  config:
    import:
       - classpath:agent/agents.yml
#         classpath:agent/fable.yml
      # NOTE 3.在加载application-dev.yml之后，上面又导入agents.yml配置文件
  datasource:
    username: postgres
    password: ${DB_PASSWORD:123456}
    url: jdbc:postgresql://127.0.0.1:5432/aether
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: Aether_HikariCP
      minimum-idle: 15
      idle-timeout: 180000
      maximum-pool-size: 25
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
    type: com.zaxxer.hikari.HikariDataSource
  sql:
    init:
      mode: always

# ====== P0-4: 会话持久化（PostgreSQL） ======
aether:
  # ====== O5: 真流式开关（显式声明，便于灰度对比：true=chunk 级下发，false=旧缓冲路径）======
  model:
    invoker:
      true-streaming: true
  session:
    persistence: true
  # ====== D1: 异步委派持久化（PostgreSQL，激活 PgAsyncDelegationStore）======
  delegation:
    persistence: true
    live-log-dir: ./cache/delegation/live
    stale-timeout: PT10M
    stale-scan-interval-ms: 60000
  graph:
    # ====== D4: 图级 trace 落盘（开发环境开启便于离线审计）======
    trace:
      persistence: true
  memory:
    pgvector:
      enabled: true
    embedding:
      # 2026-09-01: 环境变量优先，硬编码回退（本地开发便利）；注意 Key 已在 git 历史中泄露过，待轮换
      api-key: ${ZHIPU_API_KEY:***REMOVED-CREDENTIAL***}
  # 开发环境允许访问本地 Python 微服务 (localhost:8001-8003)
  ssrf:
    allow-private-urls: true
  # ====== P0: JWT Security Configuration ======
  security:
    jwt:
      secret: ${JWT_SECRET:aether-dev-jwt-secret-key-min-32-chars!!}
  # O16: CORS 白名单——未配置时拒绝所有跨域；Vite 代理转发会保留浏览器 Origin，dev 前端(5173)必须入列
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

# MyBatis 配置【如需使用记得打开】
#mybatis:
#  mapper-locations: classpath:/mybatis/mapper/*.xml
#  config-location:  classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# ====== P1-3: 可观测性配置 ======
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: aether-agent

# OpenTelemetry — 由 OTel Java Agent（-javaagent）在 JVM 启动时读取，非 Spring Boot 托管属性。
# IDE 警告 "无法解析配置属性 otel.*" 为预期行为，不影响运行时。
otel:
  traces:
    exporter: otlp
  exporter:
    otlp:
      endpoint: http://localhost:4317
  service:
    name: aether-agent