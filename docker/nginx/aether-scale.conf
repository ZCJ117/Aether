worker_processes auto;

events {
  worker_connections 2048;
}

http {
  map $http_x_session_id $aether_backend {
    default aether_sticky;
    ""      aether_balanced;
  }

  upstream aether_sticky {
    # Request hash keeps SSE callbacks on one node while shared Redis/PG let a
    # new request recover state on the other node when the old node stops.
    hash $http_x_session_id consistent;
    server aether-1:8091 max_fails=2 fail_timeout=10s;
    server aether-2:8091 max_fails=2 fail_timeout=10s;
    keepalive 64;
  }

  upstream aether_balanced {
    # New sessions have no client session id yet; distribute them across nodes.
    least_conn;
    server aether-1:8091 max_fails=2 fail_timeout=10s;
    server aether-2:8091 max_fails=2 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 8090;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
      proxy_pass http://$aether_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Session-Id $http_x_session_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
    }
  }
}
