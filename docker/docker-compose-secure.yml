# ============================================================
# P2: Aether 生产安全部署配置
# 参考：Hermes Agent Docker 安全最佳实践
# ============================================================

services:
  aether:
    image: aether:latest
    container_name: aether-secure
    user: "10000:10000"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /workspace:rw,size=1g

    pids_limit: 256
    mem_limit: 2g
    cpus: 1

    environment:
      - JASYPT_MASTER_PASSWORD=${JASYPT_MASTER_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

    ports:
      - "127.0.0.1:8091:8091"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aether-db-secure
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=${DB_USER:-aether}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=aether
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
