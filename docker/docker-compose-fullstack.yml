# ============================================================
# P1 全栈部署：业务(aether+pg) + P1 新增组件(Redis/Kafka) + 监控告警(Prometheus/Grafana/Alertmanager)
# 用途：P1-1.2 分布式限流 / P1-1.3 消息队列 / P1-3.3 监控告警 的一键演示与联调环境
# 启动：cd aether && docker compose -f docker/docker-compose-fullstack.yml --env-file docker/.env.example up -d
# 端口：8091 应用 | 9090 Prometheus | 3000 Grafana | 9093 Alertmanager | 8081 alert-echo | 5432 PG
# ============================================================
name: aether-fullstack

services:
  aether:
    image: aether:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aether-fullstack
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JASYPT_MASTER_PASSWORD=${JASYPT_MASTER_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD:-aether}
      - JWT_SECRET=${JWT_SECRET:-dev-only-jwt-secret-key-min-32-chars!!}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      # ---- P1(1.2): Redis 分布式限流（降级保护：Redis 挂自动退内存模式）----
      - AETHER_SECURITY_RATE_LIMIT_MODE=redis
      - REDIS_HOST=redis
      - MANAGEMENT_HEALTH_REDIS_ENABLED=true
      # ---- P1(1.3): Kafka 消息队列解耦 ----
      - AETHER_KAFKA_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AETHER_DASHBOARD_STATS_SOURCE=kafka
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aether-db-fullstack
    environment:
      - POSTGRES_USER=aether
      - POSTGRES_PASSWORD=${DB_PASSWORD:-aether}
      - POSTGRES_DB=aether
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ---- P1(1.2): Redis 7（分布式令牌桶限流 / 可选 session.store）----
  redis:
    image: redis:7-alpine
    container_name: aether-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  # ---- P1(1.3): Kafka（KRaft 单节点，无 ZooKeeper）----
  kafka:
    image: bitnami/kafka:3.7
    container_name: aether-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafkadata:/bitnami/kafka
    restart: unless-stopped

  # ---- P1(3.3): 监控告警栈 ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aether-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aether-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-aether}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aether-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: aether-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  # 告警通知回显通道（可实测触达；生产替换为钉钉/企微/邮件网关）
  alert-echo:
    build:
      context: ./alert-echo
    image: aether-alert-echo:latest
    container_name: aether-alert-echo
    environment:
      - ALERT_ECHO_BUFFER=200
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  promdata:
  grafanadata:
